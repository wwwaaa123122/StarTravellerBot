<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarTraveller · 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body>

<!-- ============ 登录页 ============ -->
<div id="login-view" class="login-view hidden">
  <div class="login-blob blob-a"></div>
  <div class="login-blob blob-b"></div>
  <div class="login-card glass">
    <div class="login-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2l2.4 6.9L21 9.5l-5.4 4.3 1.7 7.2L12 17.2l-5.3 3.8 1.7-7.2L3 9.5l6.6-.6z"/>
      </svg>
    </div>
    <h1 class="login-title">StarTraveller</h1>
    <p class="login-sub">星辰旅人 · 机器人管理后台</p>
    <form id="login-form" class="login-form" autocomplete="off">
      <div class="field">
        <label for="login-password">管理密码</label>
        <input id="login-password" type="password" placeholder="请输入访问密码" required>
      </div>
      <button id="login-btn" type="submit" class="btn btn-primary btn-block">
        <span>进入后台</span>
      </button>
      <p id="login-error" class="login-error hidden"></p>
    </form>
    <div class="login-meta">
      <span class="dot dot-green" id="login-server-dot"></span>
      <span id="login-server-text">正在连接服务…</span>
    </div>
  </div>
</div>

<!-- ============ 应用外壳 ============ -->
<div id="app" class="app hidden">

  <!-- 侧边栏 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l2.4 6.9L21 9.5l-5.4 4.3 1.7 7.2L12 17.2l-5.3 3.8 1.7-7.2L3 9.5l6.6-.6z"/>
        </svg>
      </div>
      <div class="brand-text">
        <b>StarTraveller</b>
        <span>管理后台</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item active" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span>仪表盘</span>
      </a>
      <a class="nav-item" data-view="users">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 2.9-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 5a3.5 3.5 0 010 6.2M18.5 14.4c1.9.9 3 2.8 3 5.6"/></svg>
        <span>用户管理</span>
      </a>
      <a class="nav-item" data-view="memory">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 3A2.5 2.5 0 0012 5.5 2.5 2.5 0 0014.5 3 2.5 2.5 0 0012 .5 2.5 2.5 0 009.5 3z"/><path d="M12 5.5V9M4 9h16v3M6 12v4M18 12v4M8 16h8v5H8z"/></svg>
        <span>记忆库</span>
      </a>
      <a class="nav-item" data-view="plugins">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4a2 2 0 114 0v3h5a2 2 0 012 2v4a2 2 0 01-2 2h-5v3a2 2 0 11-4 0v-3H5a2 2 0 01-2-2v-4a2 2 0 012-2h5z"/></svg>
        <span>插件管理</span>
      </a>
      <a class="nav-item" data-view="schedule">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8.5"/><path d="M12 9v4l2.5 2.5M8.5 3.5l1.5 2M15.5 3.5l-1.5 2"/></svg>
        <span>定时任务</span>
      </a>
      <a class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.34 1.87l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.7 1.7 0 00-1.87-.34 1.7 1.7 0 00-1.03 1.56V21a2 2 0 11-4 0v-.09a1.7 1.7 0 00-1.11-1.56 1.7 1.7 0 00-1.87.34l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.7 1.7 0 004.6 15a1.7 1.7 0 00-1.56-1.03H3a2 2 0 110-4h.09A1.7 1.7 0 004.6 9a1.7 1.7 0 00-.34-1.87l-.06-.06a2 2 0 112.83-2.83l.06.06A1.7 1.7 0 009 4.6h.01A1.7 1.7 0 0010 3.09V3a2 2 0 114 0v.09a1.7 1.7 0 001.03 1.56 1.7 1.7 0 001.87-.34l.06-.06a2 2 0 112.83 2.83l-.06.06A1.7 1.7 0 0019.4 9v.01A1.7 1.7 0 0020.9 10H21a2 2 0 110 4h-.09a1.7 1.7 0 00-1.56 1.03z"/></svg>
        <span>系统设置</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="bot-status">
        <span class="dot" id="bot-status-dot"></span>
        <span id="bot-status-text">机器人状态检测中…</span>
      </div>
      <button id="logout-btn" class="btn btn-ghost btn-block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a2 2 0 012 2v12a2 2 0 01-2 2h-4M10 17l-5-5 5-5M5 12h11"/></svg>
        <span>退出登录</span>
      </button>
    </div>
  </aside>

  <!-- 手机端侧栏遮罩 -->
  <div id="sidebar-mask" class="sidebar-mask"></div>

  <!-- 主区域 -->
  <div class="main">
    <header class="topbar">
      <button id="sidebar-toggle" class="icon-btn" aria-label="折叠菜单">
        <svg class="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        <svg class="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h1 class="page-title" id="page-title">仪表盘</h1>
      <div class="topbar-right">
        <span class="clock" id="clock">--:--:--</span>
        <button id="refresh-btn" class="icon-btn" aria-label="刷新数据">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36M21 3v6h-6"/></svg>
        </button>
        <button id="theme-toggle" class="icon-btn" aria-label="切换主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="toast-wrap" class="toast-wrap"></div>

<script src="/admin/static/vendor/echarts.min.js"></script>
<script src="/admin/static/js/core.js"></script>
<script src="/admin/static/js/views.js"></script>
</body>
</html>
