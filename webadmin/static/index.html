<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星辰旅人 · 管理后台</title>
<link rel="stylesheet" href="/admin/static/style.css">
</head>
<body>

<div id="login-view" class="login-wrap hidden">
  <form id="login-form" class="login-card">
    <div class="login-logo">⭐</div>
    <h1>星辰旅人</h1>
    <p class="login-sub">StarTraveller 管理后台</p>
    <input id="login-password" type="password" placeholder="管理密码" autocomplete="current-password" required>
    <button type="submit" id="login-btn">登 录</button>
    <div id="login-error" class="login-error"></div>
  </form>
</div>


<div id="app-view" class="app hidden">
  <aside class="sidebar">
    <div class="sidebar-brand">⭐ 星辰旅人</div>
    <nav class="sidebar-nav">
      <button class="nav-item active" data-tab="overview">📊 总览</button>
      <button class="nav-item" data-tab="plugins">🔌 插件</button>
      <button class="nav-item" data-tab="permissions">🛡️ 权限</button>
      <button class="nav-item" data-tab="ai">🤖 AI 设置</button>
      <button class="nav-item" data-tab="users">👥 用户</button>
      <button class="nav-item" data-tab="memory">🧠 记忆</button>
      <button class="nav-item" data-tab="schedule">⏰ 定时</button>
      <button class="nav-item" data-tab="config">⚙️ 配置</button>
    </nav>
    <div class="sidebar-footer">
      <div class="bot-status" id="bot-status"><span class="dot"></span> 连接中…</div>
      <button class="nav-item logout-btn" id="logout-btn">🚪 退出</button>
    </div>
  </aside>

  <main class="content">
    <header class="topbar">
      <h2 id="page-title">总览</h2>
      <span class="topbar-right" id="topbar-info"></span>
    </header>
    <section id="tab-overview" class="tab-panel active"></section>
    <section id="tab-plugins" class="tab-panel"></section>
    <section id="tab-permissions" class="tab-panel"></section>
    <section id="tab-ai" class="tab-panel"></section>
    <section id="tab-users" class="tab-panel"></section>
    <section id="tab-memory" class="tab-panel"></section>
    <section id="tab-schedule" class="tab-panel"></section>
    <section id="tab-config" class="tab-panel"></section>
  </main>
</div>

<div id="toast" class="toast"></div>
<script src="/admin/static/app.js"></script>
</body>
</html>
